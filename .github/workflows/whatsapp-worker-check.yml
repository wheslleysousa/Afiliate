name: Afiliate WhatsApp Worker - Syntax
on:
  push:
    paths:
      - 'whatsapp-worker/**'
      - '.github/workflows/whatsapp-worker-check.yml'
  pull_request:
    paths:
      - 'whatsapp-worker/**'
      - '.github/workflows/whatsapp-worker-check.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts without requiring credentials
        working-directory: whatsapp-worker
        run: |
          node --check index.js
          node --check doctor.js
          node --check templateEngine.js
          node --test test/*.test.js
          node -e "const p=require('./package.json'); if(!p.scripts.doctor || !p.scripts.check) process.exit(1);"
