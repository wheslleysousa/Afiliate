name: Keep Render Awake

# Mantém o backend do Render acordado (o plano free dorme após ~15 min ocioso).
# Faz um ping no /api/health a cada 10 minutos.
on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos (horário UTC)
  workflow_dispatch: {}        # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          echo "Pinging backend at $(date -u)"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://afiliate.onrender.com/api/health || echo "000")
            echo "Tentativa $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "OK"; exit 0; fi
            sleep 20
          done
          echo "Backend não respondeu 200 (pode estar acordando). Não falhar o workflow."
          exit 0
